name: Backend build

on:
  workflow_call:
    inputs:
      ref:
        type: string
        default: ''
      publish:
        type: boolean
        default: false
      version:
        type: string
        default: ci
    outputs:
      digest:
        description: OCI image digest
        value: ${{ jobs.image.outputs.digest }}

jobs:
  image:
    name: Linux amd64 and arm64 image
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      digest: ${{ steps.existing.outputs.digest || steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Authenticate to GHCR for release publication
        if: inputs.publish
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: repository
        name: Select image repository
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}/backend" >> "$GITHUB_OUTPUT"
      - name: Preserve an already published version image on retry
        if: inputs.publish
        id: existing
        shell: bash
        env:
          IMAGE: ${{ steps.repository.outputs.name }}:${{ inputs.version }}
          SOURCE_SHA: ${{ inputs.ref || github.sha }}
        run: |
          if docker buildx imagetools inspect "$IMAGE" > "$RUNNER_TEMP/image.txt" 2> "$RUNNER_TEMP/image-error.txt"; then
            docker pull --platform linux/amd64 "$IMAGE"
            revision="$(docker image inspect "$IMAGE" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')"
            test "$revision" = "$SOURCE_SHA" || { echo 'Refusing to replace an immutable version image from another source revision'; exit 1; }
            digest="$(awk '/^Digest:/ {print $2}' "$RUNNER_TEMP/image.txt")"
            [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
            echo "digest=$digest" >> "$GITHUB_OUTPUT"
          elif grep -Eiq 'not found|manifest unknown|name unknown' "$RUNNER_TEMP/image-error.txt"; then
            echo 'This version image does not exist yet.'
          else
            cat "$RUNNER_TEMP/image-error.txt" >&2
            exit 1
          fi
      - id: build
        if: steps.existing.outputs.digest == ''
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: packages/backend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ inputs.publish }}
          tags: |
            ${{ steps.repository.outputs.name }}:${{ inputs.version }}
            ${{ steps.repository.outputs.name }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ inputs.ref || github.sha }}
            org.opencontainers.image.version=${{ inputs.version }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
          provenance: mode=max
