name: Quality

on:
  push:
    branches: [main, gpuix]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validation:
    uses: ./.github/workflows/validation.yml

  backend:
    uses: ./.github/workflows/backend-build.yml

  desktop:
    uses: ./.github/workflows/desktop-build.yml
    with:
      version: 0.0.1
      backend-url: ${{ vars.BACKEND_URL || 'https://chat.twir.app' }}

  required:
    name: Required checks
    if: always()
    needs: [validation, backend, desktop]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every validation and build
        env:
          VALIDATION_RESULT: ${{ needs.validation.result }}
          BACKEND_RESULT: ${{ needs.backend.result }}
          DESKTOP_RESULT: ${{ needs.desktop.result }}
        run: |
          test "$VALIDATION_RESULT" = success
          test "$BACKEND_RESULT" = success
          test "$DESKTOP_RESULT" = success
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: desktop-*
          path: release-assets
      - name: Validate every built installer and update feed
        run: bash .github/scripts/assemble-release-assets.sh release-assets final-assets 0.0.1
