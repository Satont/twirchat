name: Token probe

on:
  pull_request:
  push:
    tags: ['probe-token-*']

permissions:
  contents: read

jobs:
  job-level-write:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: curl releases with job-level write token
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          code="$(curl -s -o "$RUNNER_TEMP/body.json" -w '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/releases?per_page=1")"
          echo "http=$code"
          head -c 300 "$RUNNER_TEMP/body.json"; echo
      - name: gh releases with job-level write token
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api "repos/$GITHUB_REPOSITORY/releases?per_page=1" -q 'length' 2>&1 | head -3
      - name: exact publish listing command
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq '.[] | select(.tag_name == "v1.21.17") | [.id, .draft] | @tsv' > "$RUNNER_TEMP/existing-release.txt"
          echo "lines=$(wc -l < "$RUNNER_TEMP/existing-release.txt")"
      - name: curl rate limit and headers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -s -D "$RUNNER_TEMP/h.txt" -o /dev/null -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/releases?per_page=100"
          grep -iE '^x-ratelimit|^HTTP/' "$RUNNER_TEMP/h.txt"
      - name: gh release list
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release list --limit 1 2>&1 | head -3
      - name: write probe - create and delete a draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          code="$(curl -s -o "$RUNNER_TEMP/create.json" -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/releases" \
            -d '{"tag_name":"probe-token-write-test","draft":true,"name":"probe"}')"
          echo "create_http=$code"
          head -c 200 "$RUNNER_TEMP/create.json"; echo
          id="$(python3 -c 'import json,sys;print(json.load(open(sys.argv[1])).get("id",""))' "$RUNNER_TEMP/create.json" 2>/dev/null || true)"
          echo "release_id=$id"
          if [ -n "$id" ]; then
            curl -s -o /dev/null -w 'delete_http=%{http_code}\n' -X DELETE \
              -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/$id"
          fi
  workflow-level-read:
    runs-on: ubuntu-24.04
    steps:
      - name: gh releases with workflow-level read token
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api "repos/$GITHUB_REPOSITORY/releases?per_page=1" -q 'length' 2>&1 | head -3
