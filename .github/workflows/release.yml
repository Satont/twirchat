name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing stable tag to publish or retry, e.g. v1.0.0
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    name: Validate release tag and source
    if: github.event_name != 'push' || github.event.deleted == false
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      sha: ${{ steps.version.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - id: version
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || { echo 'Stable vX.Y.Z tag required'; exit 1; }
          sha="$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
          test "$sha" = "$(git rev-parse HEAD)"
          git merge-base --is-ancestor "$sha" origin/main
          latest="$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq 'first(.[] | select(.draft == false and .prerelease == false)) | .tag_name // ""')"
          if test -n "$latest"; then
            test "$latest" != "$RELEASE_TAG" || { echo 'This version is already published; publish a new patch tag instead'; exit 1; }
            test "$(printf '%s\n%s\n' "$latest" "$RELEASE_TAG" | sort -V | tail -n 1)" = "$RELEASE_TAG" || { echo 'Release version must be newer than the current stable release'; exit 1; }
          fi
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

  validation:
    needs: version
    uses: ./.github/workflows/validation.yml
    with:
      ref: ${{ needs.version.outputs.sha }}

  desktop:
    needs: version
    uses: ./.github/workflows/desktop-build.yml
    with:
      ref: ${{ needs.version.outputs.sha }}
      version: ${{ needs.version.outputs.version }}
      backend-url: ${{ vars.BACKEND_URL || 'https://chat.twir.app' }}
      release: true
      signing: ${{ vars.RELEASE_SIGNING == 'true' }}
    secrets:
      TWIRCHAT_DONATIONALERTS_CLIENT_ID: ${{ secrets.TWIRCHAT_DONATIONALERTS_CLIENT_ID }}
      TWIRCHAT_TWITCH_CLIENT_ID: ${{ secrets.TWIRCHAT_TWITCH_CLIENT_ID }}
      TWIRCHAT_YOUTUBE_CLIENT_ID: ${{ secrets.TWIRCHAT_YOUTUBE_CLIENT_ID }}
      TWIRCHAT_YOUTUBE_CLIENT_SECRET: ${{ secrets.TWIRCHAT_YOUTUBE_CLIENT_SECRET }}
      MACOS_CERTIFICATES_P12_BASE64: ${{ secrets.MACOS_CERTIFICATES_P12_BASE64 }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      MACOS_SIGN_APP_IDENTITY: ${{ secrets.MACOS_SIGN_APP_IDENTITY }}
      MACOS_SIGN_INSTALL_IDENTITY: ${{ secrets.MACOS_SIGN_INSTALL_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
      WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}

  assets-preflight:
    name: Validate complete release assets
    needs: [version, desktop]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.version.outputs.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: desktop-*
          path: release-assets
      - name: Validate installers, download links, feeds and checksums before publication
        env:
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
        run: |
          bash .github/scripts/assemble-release-assets.sh release-assets final-assets "$RELEASE_VERSION"
          bash .github/scripts/render-release-downloads.sh final-assets \
            "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" "$RELEASE_TAG" > /dev/null

  backend:
    needs: [version, validation, desktop, assets-preflight]
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/backend-build.yml
    with:
      ref: ${{ needs.version.outputs.sha }}
      version: ${{ needs.version.outputs.version }}
      publish: true

  publish:
    name: Publish complete release
    needs: [version, validation, desktop, assets-preflight, backend]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ needs.version.outputs.tag }}
      RELEASE_VERSION: ${{ needs.version.outputs.version }}
      RELEASE_SHA: ${{ needs.version.outputs.sha }}
      BACKEND_DIGEST: ${{ needs.backend.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.version.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: desktop-*
          path: release-assets
      - name: Assemble assets without silent filename collisions
        shell: bash
        run: bash .github/scripts/assemble-release-assets.sh release-assets final-assets "$RELEASE_VERSION"
      - name: Generate download links for the release notes
        shell: bash
        run: |
          bash .github/scripts/render-release-downloads.sh final-assets \
            "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" "$RELEASE_TAG" > "$RUNNER_TEMP/release-downloads.md"
      - name: Create or resume draft release
        shell: bash
        run: |
          git fetch --no-tags origin "refs/tags/$RELEASE_TAG"
          test "$RELEASE_SHA" = "$(git rev-parse 'FETCH_HEAD^{commit}')"
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq ".[] | select(.tag_name == \"$RELEASE_TAG\") | [.id, .draft] | @tsv" > "$RUNNER_TEMP/existing-release.txt"
          if test -s "$RUNNER_TEMP/existing-release.txt"; then
            read -r id draft < "$RUNNER_TEMP/existing-release.txt"
            test "$draft" = true || { echo 'Refusing to overwrite an already published release'; exit 1; }
          else
            {
              cat "$RUNNER_TEMP/release-downloads.md"
              printf '\nGPUIX desktop release for Linux x64, Windows x64, and macOS Apple Silicon/Intel.\n\n'
              printf 'Source: `%s`\n\n' "$RELEASE_SHA"
              printf 'Backend image: `ghcr.io/%s/backend@%s`\n\n' "${GITHUB_REPOSITORY,,}" "$BACKEND_DIGEST"
              cat final-assets/signature-*.txt
              printf '\nUnsigned macOS builds are not notarized; unsigned Windows builds may show SmartScreen warnings.\n\n'
              printf 'Use the installer for your architecture. SHA256SUMS covers every attached package and update feed.\n'
            } > "$RUNNER_TEMP/release-notes.md"
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --verify-tag \
              --target "$RELEASE_SHA" --draft --title "TwirChat $RELEASE_TAG" \
              --generate-notes --notes-file "$RUNNER_TEMP/release-notes.md"
          fi
      - name: Upload every architecture before making the release public
        shell: bash
        run: |
          gh release upload "$RELEASE_TAG" final-assets/* --clobber --repo "$GITHUB_REPOSITORY"
          gh release edit "$RELEASE_TAG" --draft=false --latest --repo "$GITHUB_REPOSITORY"
