name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Stable version, e.g. v1.0.0
        required: true

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.value.outputs.tag }}
      version: ${{ steps.value.outputs.version }}
    steps:
      - id: value
        shell: bash
        run: |
          tag='${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}'
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Stable vX.Y.Z tag required"; exit 1; }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

  desktop:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            channel: linux
            target: linux
            main_exe: twirchat
            runtime: linux-x64
            upx: true
          - os: windows-latest
            channel: win
            target: win
            main_exe: twirchat.exe
            runtime: win-x64
            upx: true
          - os: macos-latest
            channel: osx
            target: osx
            main_exe: TwirChat
            runtime: ''
            upx: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-go@v5
        with: { go-version: '1.26.x' }
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: latest }
      - uses: arduino/setup-task@v2
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '8.0.x' }
      - name: Install Wails and Velopack
        shell: bash
        run: |
          go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-alpha2.117
          dotnet tool install --global vpk
          echo "$HOME/go/bin" >> "$GITHUB_PATH"
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"
      - name: Linux webview dependencies and UPX
        if: matrix.target == 'linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev upx-ucl
      - name: Windows UPX
        if: matrix.target == 'win'
        shell: pwsh
        run: choco install upx -y
      - name: Install frontend dependencies
        run: bun install --frozen-lockfile
      - name: Build Wails application
        working-directory: packages/desktop
        shell: bash
        run: |
          wails3 build -ldflags="-s -w -X main.version=${{ needs.version.outputs.version }}"
          test -f bin/twirchat || test -f bin/twirchat.exe || test -d bin/TwirChat.app
      - name: Compress executable with UPX
        if: matrix.upx
        working-directory: packages/desktop
        shell: bash
        run: |
          exe="bin/${{ matrix.main_exe }}"
          upx --best --lzma "$exe"
          upx -t "$exe"
      - name: Package and publish Velopack release
        working-directory: packages/desktop
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          mkdir -p velopack
          vpk download github --repoUrl "https://github.com/${{ github.repository }}" --token "$GH_TOKEN" --channel "${{ matrix.channel }}" --outputDir velopack || true
          vpk "[${{ matrix.target }}]" pack -u dev.twirchat.app --packTitle TwirChat -v "$VERSION" --packDir bin --mainExe "${{ matrix.main_exe }}" --channel "${{ matrix.channel }}" --outputDir velopack --runtime "${{ matrix.runtime }}"
          vpk upload github --repoUrl "https://github.com/${{ github.repository }}" --token "$GH_TOKEN" --publish --merge --tag "$TAG" --channel "${{ matrix.channel }}" --outputDir velopack
