name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Stable version, e.g. v1.0.0
        required: true

permissions:
  contents: write
  packages: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.value.outputs.tag }}
      version: ${{ steps.value.outputs.version }}
    steps:
      - id: value
        shell: bash
        run: |
          tag='${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}'
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Stable vX.Y.Z tag required"; exit 1; }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

  changelog:
    needs: version
    runs-on: ubuntu-latest
    outputs:
      body: ${{ steps.notes.outputs.body }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --latest --strip header --output release-notes.md
      - id: notes
        shell: bash
        run: |
          {
            echo 'body<<EOF'
            cat release-notes.md
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

  release:
    needs: [version, changelog]
    runs-on: ubuntu-latest
    steps:
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: Release ${{ needs.version.outputs.tag }}
          body: ${{ needs.changelog.outputs.body }}
          target_commitish: ${{ github.sha }}
        env:
          GITHUB_TOKEN: ${{ github.token }}

  backend-docker:
    needs: [version, release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: image
        shell: bash
        run: echo "repository=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v5
        with:
          context: .
          file: ./packages/backend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ steps.image.outputs.repository }}/backend:${{ needs.version.outputs.version }}
            ghcr.io/${{ steps.image.outputs.repository }}/backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  desktop:
    needs: [version, release]
    env:
      BACKEND_URL: ${{ vars.BACKEND_URL || secrets.BACKEND_URL }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            channel: linux
            target: linux
            main_exe: twirchat
            runtime: linux-x64
          - os: windows-latest
            channel: win
            target: win
            main_exe: twirchat.exe
            runtime: win-x64
          # macOS builds on the arm64 runner: bun --compile cannot produce
          # universal binaries, so the osx feed is Apple Silicon only.
          - os: macos-latest
            channel: osx
            target: osx
            main_exe: TwirChat
            runtime: ''
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: '.bun-version'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Install Velopack
        shell: bash
        run: |
          dotnet tool install --global vpk
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build desktop binary
        if: matrix.target != 'osx'
        working-directory: packages/desktop
        shell: bash
        run: |
          : "${BACKEND_URL:?BACKEND_URL repository variable or secret must be configured for release builds}"
          bun run build:overlay
          rm -rf bin && mkdir -p bin
          bun build --compile src/gpuix/main.tsx \
            --outfile "bin/${{ matrix.main_exe }}" \
            --define "__APP_VERSION__=\"${{ needs.version.outputs.version }}\"" \
            --define "__BACKEND_URL__=\"${BACKEND_URL}\""
          # overlay assets + fonts are served from disk (see overlay-server.ts),
          # ship them next to the executable
          cp -r dist/overlay bin/overlay
          cp -r public/fonts bin/fonts
          test -x "bin/${{ matrix.main_exe }}"
      - name: Build macOS application bundle
        if: matrix.target == 'osx'
        working-directory: packages/desktop
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          : "${BACKEND_URL:?BACKEND_URL repository variable or secret must be configured for release builds}"
          bun run build:overlay
          app='bin/TwirChat.app'
          rm -rf "$app"
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
          bun build --compile src/gpuix/main.tsx \
            --outfile "$app/Contents/MacOS/TwirChat" \
            --define "__APP_VERSION__=\"${VERSION}\"" \
            --define "__BACKEND_URL__=\"${BACKEND_URL}\""
          cp -r dist/overlay "$app/Contents/MacOS/overlay"
          cp -r public/fonts "$app/Contents/MacOS/fonts"
          iconutil -c icns assets/icon.iconset -o "$app/Contents/Resources/icon.icns" || true
          cat > "$app/Contents/Info.plist" <<EOFPLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key>
            <string>TwirChat</string>
            <key>CFBundleDisplayName</key>
            <string>TwirChat</string>
            <key>CFBundleIdentifier</key>
            <string>dev.twirchat.app</string>
            <key>CFBundleExecutable</key>
            <string>TwirChat</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>CFBundleVersion</key>
            <string>${VERSION}</string>
            <key>CFBundleShortVersionString</key>
            <string>${VERSION}</string>
            <key>CFBundleIconFile</key>
            <string>icon.icns</string>
            <key>NSHighResolutionCapable</key>
            <true/>
            <key>LSMinimumSystemVersion</key>
            <string>13.0</string>
          </dict>
          </plist>
          EOFPLIST
          test -x "$app/Contents/MacOS/TwirChat"
          plutil -lint "$app/Contents/Info.plist"
      - name: Download previous Velopack channel feed
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          dest="$(mktemp -d)/feed.json"
          if gh release download --repo ${{ github.repository }} --pattern 'releases.${{ matrix.channel }}.json' --output "$dest" --clobber; then
            echo "FEED_PATH=$dest" >> "$GITHUB_ENV"
          else
            echo "No previous feed for ${{ matrix.channel }}; starting a new one"
          fi
      - name: Velopack pack
        shell: bash
        working-directory: packages/desktop
        run: |
          args=(
            --packId dev.twirchat.app
            --packVersion "${{ needs.version.outputs.version }}"
            --mainExe "${{ matrix.main_exe }}"
            --outputDir releases
            --channel "${{ matrix.channel }}"
            --packAuthors "Satont"
            --packTitle "TwirChat"
            --delta BestSpeed
          )
          if [ -n "${FEED_PATH:-}" ]; then
            args+=(--releaseNotes "$FEED_PATH")
          fi
          if [ "${{ matrix.target }}" = "osx" ]; then
            vpk pack "${args[@]}" --packDir bin/TwirChat.app
          else
            vpk "[${{ matrix.target }}]" pack "${args[@]}"               --runtime "${{ matrix.runtime }}"               --packDir bin
          fi
      - name: Upload and merge Velopack channel feed
        shell: bash
        working-directory: packages/desktop
        run: |
          vpk upload github             --outputDir releases             --repoUrl "https://github.com/${{ github.repository }}"             --token "${{ github.token }}"             --publish             --merge             --releaseName "Release ${{ needs.version.outputs.tag }}"             --tag "${{ needs.version.outputs.tag }}"             --channel "${{ matrix.channel }}"
      - name: Upload installer artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: packages/desktop
        run: |
          shopt -s nullglob
          assets=(
            releases/*.AppImage
            releases/*.AppImage.tar.zst
            releases/*-Portable.zip
            releases/*-Setup.exe
            releases/*-Setup.msi
            releases/*-Portable.tar.zst
            releases/velopack.*.nupkg
          )
          if ((${#assets[@]})); then
            gh release upload "${{ needs.version.outputs.tag }}" "${assets[@]}" --clobber --repo ${{ github.repository }}
          fi
