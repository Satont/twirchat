name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Stable version, e.g. v1.0.0
        required: true

permissions:
  contents: write
  packages: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.value.outputs.tag }}
      version: ${{ steps.value.outputs.version }}
    steps:
      - id: value
        shell: bash
        run: |
          tag='${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}'
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Stable vX.Y.Z tag required"; exit 1; }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

  changelog:
    needs: version
    runs-on: ubuntu-latest
    outputs:
      body: ${{ steps.notes.outputs.body }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --latest --strip header --output release-notes.md
      - id: notes
        shell: bash
        run: |
          {
            echo 'body<<EOF'
            cat release-notes.md
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

  release:
    needs: [version, changelog]
    runs-on: ubuntu-latest
    steps:
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: Release ${{ needs.version.outputs.tag }}
          body: ${{ needs.changelog.outputs.body }}
          target_commitish: ${{ github.sha }}
        env:
          GITHUB_TOKEN: ${{ github.token }}

  backend-docker:
    needs: [version, release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: image
        shell: bash
        run: echo "repository=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v5
        with:
          context: .
          file: ./packages/backend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ steps.image.outputs.repository }}/backend:${{ needs.version.outputs.version }}
            ghcr.io/${{ steps.image.outputs.repository }}/backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  desktop:
    needs: [version, release]
    env:
      BACKEND_URL: ${{ vars.BACKEND_URL || secrets.BACKEND_URL }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            channel: linux
            target: linux
            main_exe: twirchat
            runtime: linux-x64
            cgo_ldflags: ''
            upx: true
          - os: windows-latest
            channel: win
            target: win
            main_exe: twirchat.exe
            runtime: win-x64
            cgo_ldflags: -lntdll
            upx: true
          - os: macos-latest
            channel: osx
            target: osx
            main_exe: TwirChat
            runtime: ''
            cgo_ldflags: ''
            upx: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-go@v5
        with: { go-version: '1.26.x' }
      - uses: oven-sh/setup-bun@v2
        with: { bun-version-file: '.bun-version' }
      - uses: arduino/setup-task@v2
        with:
          repo-token: ${{ github.token }}
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '8.0.x' }
      - name: Linux WebKitGTK 6 build dependencies and UPX
        if: matrix.target == 'linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libgtk-4-dev libwebkitgtk-6.0-dev upx-ucl
          pkg-config --modversion gtk4
          pkg-config --modversion webkitgtk-6.0
      - name: Install Wails and Velopack
        shell: bash
        run: |
          go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-alpha2.117
          dotnet tool install --global vpk
          echo "$HOME/go/bin" >> "$GITHUB_PATH"
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"
      - name: Windows UPX
        if: matrix.target == 'win'
        shell: pwsh
        run: choco install upx -y
      - name: Install frontend dependencies
        run: bun install --frozen-lockfile
      - name: Build Wails application
        if: matrix.target != 'osx'
        working-directory: packages/desktop
        shell: bash
        run: |
          : "${BACKEND_URL:?BACKEND_URL repository variable or secret must be configured for release builds}"
          export GO_LDFLAGS="-s -w -X main.version=${{ needs.version.outputs.version }} -X main.buildBackendURL=${BACKEND_URL}"
          export CGO_LDFLAGS="${{ matrix.cgo_ldflags }}"
          wails3 build
          if [[ "${{ matrix.target }}" == 'win' && -f bin/twirchat && ! -f bin/twirchat.exe ]]; then
            mv bin/twirchat bin/twirchat.exe
          fi
          test -f "bin/${{ matrix.main_exe }}"
      - name: Stage MinGW GCC runtime
        if: matrix.target == 'win'
        working-directory: packages/desktop
        shell: pwsh
        run: |
          $runtimeDll = (& gcc -print-file-name=libgcc_s_seh-1.dll).Trim()
          if ($runtimeDll -eq 'libgcc_s_seh-1.dll' -or -not (Test-Path -LiteralPath $runtimeDll)) {
            throw 'MinGW GCC runtime libgcc_s_seh-1.dll was not found.'
          }
          Copy-Item -LiteralPath $runtimeDll -Destination bin/libgcc_s_seh-1.dll
      - name: Build macOS application bundle
        if: matrix.target == 'osx'
        working-directory: packages/desktop
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          : "${BACKEND_URL:?BACKEND_URL repository variable or secret must be configured for release builds}"
          app='bin/TwirChat.app'
          rm -rf "$app"
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
          printf 'Preserve macOS resources in the Velopack bundle.\n' > "$app/Contents/Resources/artifact-sentinel.txt"
          go build -ldflags "-s -w -X main.version=$VERSION -X main.buildBackendURL=$BACKEND_URL" -o "$app/Contents/MacOS/TwirChat" .
          cat > "$app/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleDisplayName</key><string>TwirChat</string>
            <key>CFBundleExecutable</key><string>TwirChat</string>
            <key>CFBundleIdentifier</key><string>dev.twirchat.app</string>
            <key>CFBundleInfoDictionaryVersion</key><string>6.0</string>
            <key>CFBundleName</key><string>TwirChat</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>$VERSION</string>
            <key>CFBundleVersion</key><string>$VERSION</string>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict></plist>
          PLIST
          test -x "$app/Contents/MacOS/TwirChat"
          plutil -lint "$app/Contents/Info.plist"
      - name: Compress executable with UPX
        if: matrix.upx
        working-directory: packages/desktop
        shell: bash
        run: |
          exe="bin/${{ matrix.main_exe }}"
          upx --best --lzma "$exe"
          upx -t "$exe"
      - name: Package and publish Velopack release
        if: matrix.target != 'osx'
        working-directory: packages/desktop
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          mkdir -p velopack
          vpk download github --repoUrl "https://github.com/${{ github.repository }}" --token "$GH_TOKEN" --channel "${{ matrix.channel }}" --outputDir velopack || true
          if gh release view "$TAG" --repo "${{ github.repository }}" --json assets --jq '.assets[].name' | grep -Fx "releases.${{ matrix.channel }}.json"; then
            echo "${{ matrix.channel }} $VERSION is already published; preserving the existing release."
            exit 0
          fi
          vpk "[${{ matrix.target }}]" pack -u dev.twirchat.app --packTitle TwirChat -v "$VERSION" --packDir bin --mainExe "${{ matrix.main_exe }}" --channel "${{ matrix.channel }}" --outputDir velopack --runtime "${{ matrix.runtime }}"
          vpk upload github --repoUrl "https://github.com/${{ github.repository }}" --token "$GH_TOKEN" --publish --merge --tag "$TAG" --channel "${{ matrix.channel }}" --outputDir velopack
          gh release upload "$TAG" velopack/* --repo "${{ github.repository }}" --clobber
          gh release view "$TAG" --repo "${{ github.repository }}" --json assets --jq '.assets[].name' | grep -Fx "releases.${{ matrix.channel }}.json"
      - name: Package and publish macOS Velopack release
        if: matrix.target == 'osx'
        working-directory: packages/desktop
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          mkdir -p velopack
          vpk download github --repoUrl "https://github.com/${{ github.repository }}" --token "$GH_TOKEN" --channel "${{ matrix.channel }}" --outputDir velopack || true
          if gh release view "$TAG" --repo "${{ github.repository }}" --json assets --jq '.assets[].name' | grep -Fx "releases.${{ matrix.channel }}.json"; then
            echo "${{ matrix.channel }} $VERSION is already published; preserving the existing release."
            exit 0
          fi
          vpk "[osx]" pack -u dev.twirchat.app --packTitle TwirChat -v "$VERSION" --packDir bin/TwirChat.app --mainExe TwirChat --channel "${{ matrix.channel }}" --outputDir velopack
          vpk upload github --repoUrl "https://github.com/${{ github.repository }}" --token "$GH_TOKEN" --publish --merge --tag "$TAG" --channel "${{ matrix.channel }}" --outputDir velopack
          gh release upload "$TAG" velopack/* --repo "${{ github.repository }}" --clobber
          gh release view "$TAG" --repo "${{ github.repository }}" --json assets --jq '.assets[].name' | grep -Fx "releases.${{ matrix.channel }}.json"
