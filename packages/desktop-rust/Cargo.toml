[package]
name = "twirchat"
version = "0.1.0"
edition = "2024"
publish = false
default-run = "twirchat"

[package.metadata.twirchat.guardrails]
policy = [
  "Keep recoverable production paths panic-free; prefer Result or safe fallbacks over unwrap/expect/panic.",
  "Use #[expect(..., reason = \"...\")] for unavoidable local clippy waivers instead of blanket allow.",
  "Defer Miri, property tests, and fuzzing unless a stable narrow pure-logic target is identified.",
]

[dependencies]
base64 = "0.22"
chrono = "0.4.44"
futures = "0.3"
gethostname = "1.1"
gpui = { git = "https://github.com/zed-industries/zed", rev = "8bdd78e023805bdc1f8cae6dea79ef097cc49f46" }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "8bdd78e023805bdc1f8cae6dea79ef097cc49f46", features = [
  "wayland",
  "x11",
] }
image = "0.25.1"
theme = { git = "https://github.com/zed-industries/zed", rev = "8bdd78e023805bdc1f8cae6dea79ef097cc49f46" }
ui = { git = "https://github.com/zed-industries/zed", rev = "8bdd78e023805bdc1f8cae6dea79ef097cc49f46" }
reqwest = { version = "0.12", default-features = false, features = [
  "blocking",
  "json",
  "rustls-tls",
] }
reqwest_client = { git = "https://github.com/zed-industries/zed", rev = "8bdd78e023805bdc1f8cae6dea79ef097cc49f46" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha1_smol = "1.0"
sha2 = "0.10"
tungstenite = { version = "0.24", default-features = false, features = [
  "handshake",
  "rustls-tls-webpki-roots",
] }
ureq = "3.3"
url = "2.5"
uuid = { version = "1.19", features = ["v4"] }
velopack = "0.0.1589-ga2c5a97"

[dev-dependencies]
tempfile = "3.23"

[profile.dev.package."*"]
incremental = false
