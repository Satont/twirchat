# git-cliff ~ default configuration file
# https://git-cliff.org/docs/configuration/

[changelog]
# template for the changelog body
# see https://keats.github.io/tera/docs/#introduction
header = """
# Changelog

All notable changes to this project will be documented in this file.
"""

body = """
{% if version -%}
    ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else -%}
    ## [unreleased]
{% endif -%}

{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | upper_first }}
    {% for commit in commits %}
        - {% if commit.scope %}**{{ commit.scope }}**: {% endif %}{{ commit.message | upper_first }}{% if commit.remote.pr_number %} ([#{{ commit.remote.pr_number }}](https://github.com/{{ remote.github.owner }}/{{ remote.github.repo }}/pull/{{ commit.remote.pr_number }})){% endif %} ([{{ commit.id | truncate(length=7, end="") }}](https://github.com/{{ remote.github.owner }}/{{ remote.github.repo }}/commit/{{ commit.id }}))
    {%- endfor %}
{% endfor %}
"""

footer = """
<!-- generated by git-cliff -->
"""

# remove the leading and trailing whitespace from the template
trim = true

# postprocessors
postprocessors = [
  # { pattern = '<REPO>', replace = "https://github.com/orhun/git-cliff" },
]

[git]
# parse the commits based on https://www.conventionalcommits.org
conventional_commits = true

# filter out the commits that are not conventional
filter_unconventional = true

# process each line of a commit message as an individual commit
split_commits = false

# regex for preprocessing the commit messages
commit_preprocessors = [
  # { pattern = "\\((\\w+\\s)?#([0-9]+)\\)", replace = "([#${2}](<REPO>/issues/${2}))" },
]

# regex for parsing and grouping commits
commit_parsers = [
  { message = "^feat", group = "🚀 Features" },
  { message = "^fix", group = "🐛 Bug Fixes" },
  { message = "^doc", group = "📚 Documentation" },
  { message = "^perf", group = "⚡ Performance" },
  { message = "^refactor", group = "🚜 Refactor" },
  { message = "^style", group = "🎨 Styling" },
  { message = "^test", group = "🧪 Testing" },
  { message = "^ci", group = "⚙️ Miscellaneous Tasks" },
  { message = "^build", group = "📦 Build System" },
  { message = "^chore\\(release\\):", skip = true },
  { message = "^chore", group = "⚙️ Miscellaneous Tasks" },
  { body = ".*security", group = "🛡️ Security" },
  { message = "^revert", group = "◀️ Revert" },
]

# protect breaking changes from being skipped due to matching a skipping commit_parser
protect_breaking_commits = false

# filter out the commits that are not matched by commit parsers
filter_commits = true

# regex for matching git tags
tag_pattern = "^[v]?[0-9]+\\.[0-9]+\\.[0-9]+$"

# regex for skipping tags
# skip_tags = "v0\\.1\\.0-beta\\.1"

# regex for ignoring tags
# ignore_tags = ""

# sort the tags topologically
topo_order = false

# sort the commits inside sections by oldest/newest order
sort_commits = "newest"

# limit the number of commits included in the changelog.
# limit_commits = 42

# parse issue links like #123
link_parsers = [{ pattern = "#(\\d+)", href = "https://github.com/Satont/twirchat/issues/$1" }]

[remote]
name = "origin"
url = "https://github.com/Satont/twirchat"

[remote.github]
owner = "Satont"
repo = "twirchat"

[bump]
features_always_bump_minor = false
breaking_always_bump_major = true
